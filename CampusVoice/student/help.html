<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help & Support | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/student.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>
const content=`<div class="help-hero"><div><div class="kicker">CAMPUSVOICE SUPPORT CENTER</div><h2>How can we help you today?</h2><p>Quick guides for reporting concerns, tracking progress, and confirming resolutions.</p></div><div class="help-orbit"><span>?</span><i></i><b></b><em></em></div></div><div class="help-grid"><button class="help-card" data-help="report"><span class="help-icon">＋</span><span><strong>Report a Concern</strong><small>Submit a complete and accurate campus report.</small></span><b>→</b></button><button class="help-card" data-help="location"><span class="help-icon">⌖</span><span><strong>Choose a Location</strong><small>Learn how Building, Floor, and Area work together.</small></span><b>→</b></button><button class="help-card" data-help="photo"><span class="help-icon">▣</span><span><strong>Photo Evidence</strong><small>See what makes a useful supporting photo.</small></span><b>→</b></button><button class="help-card" data-help="tracking"><span class="help-icon">◌</span><span><strong>Track Your Concern</strong><small>Understand each status from submission to resolution.</small></span><b>→</b></button><button class="help-card" data-help="notifications"><span class="help-icon">◉</span><span><strong>Notifications</strong><small>Know when CampusVoice has an update for you.</small></span><b>→</b></button><button class="help-card" data-help="resolution"><span class="help-icon">✓</span><span><strong>Resolution Confirmation</strong><small>Confirm whether a resolved concern was actually addressed.</small></span><b>→</b></button></div><div class="help-detail" id="helpDetail"><div class="help-detail-empty"><span>✦</span><strong>Select a guide above</strong><p>Choose a topic to see a short interactive guide.</p></div></div><div class="status-road"><div class="section-heading"><div><h3>CampusVoice concern journey</h3><p>Your concern moves through a coordinated university workflow.</p></div></div><div class="road"><button data-status="Submitted"><span>01</span><b>Submitted</b><small>Report received</small></button><i></i><button data-status="Under Review"><span>02</span><b>Under Review</b><small>Admin assessment</small></button><i></i><button data-status="Assigned"><span>03</span><b>Assigned</b><small>Staff selected</small></button><i></i><button data-status="In Progress"><span>04</span><b>In Progress</b><small>Work underway</small></button><i></i><button data-status="Resolved"><span>05</span><b>Resolved</b><small>Action completed</small></button><i></i><button data-status="Closed"><span>06</span><b>Closed</b><small>Verified & closed</small></button></div><div class="road-note" id="roadNote">Select a status to learn what it means.</div></div><div class="help-emergency"><strong>Need urgent safety assistance?</strong><span>CampusVoice does not replace emergency services. Follow CMU emergency procedures for immediate safety concerns.</span></div>`;
shell('help.html','Help & Support','Guides and support information for students.',content,'');
const guides={report:{title:'How to Report a Concern',steps:['Choose the category that best describes the issue.','Provide the exact Building, Floor, and Area / Room.','Describe what happened using clear, factual details.','Attach the required supporting photo before submitting.','Review your information and submit the concern.']},location:{title:'How Location Selection Works',steps:['Select the building where the concern is located.','The Floor list updates based on active locations in that building.','Choose the correct floor to load available areas or rooms.','Select the exact Area / Room so staff can locate the issue quickly.']},photo:{title:'How to Add Good Photo Evidence',steps:['Capture the affected item, area, or condition clearly.','Make sure the image is bright enough to understand the issue.','Avoid unrelated personal information when possible.','Use JPG, PNG, or WebP. A supporting photo is required for submission.']},tracking:{title:'Understanding Concern Status',steps:['Submitted means your report has been recorded.','Under Review means an administrator is assessing the concern.','Assigned means the concern has been assigned to appropriate university personnel.','In Progress means work or investigation is underway.','Resolved means the reported issue has been addressed.','Closed means the resolution has been verified and officially closed.']},notifications:{title:'CampusVoice Notifications',steps:['You receive updates when your concern changes.','Open a notification to view the related concern record.','Unread notifications are highlighted so important updates are easy to spot.']},resolution:{title:'Resolution Confirmation',steps:['When a concern is marked Resolved, review the response and action taken.','Select Yes, resolved if the issue was actually addressed.','Select No, still needs attention if the issue remains unresolved.','You may provide feedback when the confirmation is available.']}};
document.querySelectorAll('[data-help]').forEach(btn=>btn.onclick=()=>{const g=guides[btn.dataset.help];document.getElementById('helpDetail').innerHTML=`<div class="detail-icon">✦</div><div><div class="kicker">QUICK GUIDE</div><h3>${g.title}</h3><ol>${g.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;document.querySelectorAll('.help-card').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');document.getElementById('helpDetail').scrollIntoView({behavior:'smooth',block:'nearest'})});
const statusNotes={Submitted:'Your concern has been received and recorded in CampusVoice.', 'Under Review':'An administrator is reviewing the concern and determining the appropriate priority and next action.',Assigned:'The concern has been assigned to appropriate university personnel for action.', 'In Progress':'Assigned staff are investigating, repairing, or otherwise addressing the concern.',Resolved:'The staff member has recorded the action taken and marked the concern as resolved.',Closed:'The resolution has been verified and the concern is officially closed.'};document.querySelectorAll('[data-status]').forEach(btn=>btn.onclick=()=>{document.getElementById('roadNote').textContent=statusNotes[btn.dataset.status];document.querySelectorAll('[data-status]').forEach(x=>x.classList.remove('active'));btn.classList.add('active')});
</script></body></html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard | CampusVoice</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/student.css">
</head>

<body>

    <script src="../js/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/shell.js"></script>

    <script>
        const config = window.CAMPUSVOICE_SUPABASE || {};

        const supabaseClient = window.supabase.createClient(
            config.url,
            config.publishableKey
        );


        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function formatDate(value) {
            if (!value) {
                return "—";
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleDateString("en-PH", {
                year: "numeric",
                month: "short",
                day: "numeric"
            });
        }


        function statusBadge(status) {
            if (typeof badge === "function") {
                return badge(status);
            }

            return `
                <span class="badge">
                    ${escapeHtml(status || "Submitted")}
                </span>
            `;
        }


        function priorityBadge(priority) {
            if (typeof priority === "function") {
                return priority(priority);
            }

            return `
                <span>
                    ${escapeHtml(priority || "To be assessed")}
                </span>
            `;
        }


        function getStatusCount(concerns, statusIds) {
    return concerns.filter(concern =>
        statusIds.includes(Number(concern.status_id))
    ).length;
}


        function renderDashboard(
            profile,
            concerns,
            notifications
        ) {

            
const totalReports = concerns.length;
const underReview = getStatusCount(concerns, [2]);
const inProgress = getStatusCount(concerns, [3, 4, 5, 7]);
const resolved = getStatusCount(concerns, [6, 8]);


            const rows = concerns
                .slice(0, 5)
                .map(concern => `
                    <tr>

                        <td>
                            <a
                                class="link"
                                href="concern-details.html?id=${encodeURIComponent(
                                    concern.concern_id
                                )}"
                            >
                                ${escapeHtml(
                                    concern.concern_id
                                )}
                            </a>
                        </td>

                        <td>
                            <strong>
                                ${escapeHtml(
                                    concern.title
                                )}
                            </strong>

                            <br>

                            <span class="card-subtitle">
                                ${escapeHtml(
                                    concern.category
                                )}

                                ·

                                ${escapeHtml(
                                    concern.building
                                )}
                            </span>
                        </td>

                        <td>
                            ${formatDate(
                                concern.date_submitted
                            )}
                        </td>

                        <td>
                            ${statusBadge(
                                concern.status
                            )}
                        </td>

                        <td>
                            ${priorityBadge(
                                concern.priority
                            )}
                        </td>

                    </tr>
                `)
                .join("");


            const notificationsHtml = notifications
                .slice(0, 3)
                .map(notification => `
                    <div class="list-row">

                        <div>

                            <b>
                                ${escapeHtml(
                                    notification.title
                                )}
                            </b>

                            <small>
                                ${escapeHtml(
                                    notification.message
                                )}
                            </small>

                        </div>

                    </div>
                `)
                .join("");


            const content = `

                <div class="hero">

                    <div class="eyebrow">
                        WELCOME BACK
                    </div>

                    <h2>
                        Keep your campus voice heard.
                    </h2>

                    <p>
                        Report a concern, follow its progress,
                        and receive updates from university
                        personnel in one connected workflow.
                    </p>

                    <div
                        class="actions"
                        style="margin-top: 16px;"
                    >

                        <a
                            class="btn gold"
                            href="report.html"
                        >
                            ＋ Report a Concern
                        </a>

                        <a
                            class="btn"
                            href="concerns.html"
                        >
                            View My Concerns
                        </a>

                    </div>

                </div>


                <div class="grid g4">

                    <div
                        class="card metric"
                        onclick="location.href='concerns.html'"
                    >

                        <div class="metric-label">
                            TOTAL REPORTS
                        </div>

                        <div class="metric-value">
                            ${totalReports}
                        </div>

                        <div class="metric-note">
                            All concerns submitted by you
                        </div>

                    </div>


                    <div
                        class="card metric"
                        onclick="location.href='concerns.html?status=Under Review'"
                    >

                        <div class="metric-label">
                            UNDER REVIEW
                        </div>

                        <div class="metric-value">
                            ${underReview}
                        </div>

                        <div class="metric-note">
                            Being assessed
                        </div>

                    </div>


                    <div
                        class="card metric"
                        onclick="location.href='concerns.html?status=In Progress'"
                    >

                        <div class="metric-label">
                            IN PROGRESS
                        </div>

                        <div class="metric-value">
                            ${inProgress}
                        </div>

                        <div class="metric-note">
                            Action is ongoing
                        </div>

                    </div>


                    <div
                        class="card metric"
                        onclick="location.href='concerns.html?status=Resolved'"
                    >

                        <div class="metric-label">
                            RESOLVED
                        </div>

                        <div class="metric-value">
                            ${resolved}
                        </div>

                        <div class="metric-note">
                            Completed concerns
                        </div>

                    </div>

                </div>


                <div
                    class="grid g3"
                    style="margin-top: 18px;"
                >

                    <a
                        class="card quick-card"
                        href="report.html"
                    >

                        <span class="quick-icon">
                            ＋
                        </span>

                        <div>

                            <b>
                                Report a Concern
                            </b>

                            <div class="card-subtitle">
                                Submit a new campus issue
                            </div>

                        </div>

                    </a>


                    <a
                        class="card quick-card"
                        href="notifications.html"
                    >

                        <span class="quick-icon">
                            ◌
                        </span>

                        <div>

                            <b>
                                Notifications
                            </b>

                            <div class="card-subtitle">
                                View recent updates
                            </div>

                        </div>

                    </a>


                    <a
                        class="card quick-card"
                        href="help.html"
                    >

                        <span class="quick-icon">
                            ?
                        </span>

                        <div>

                            <b>
                                Help & Support
                            </b>

                            <div class="card-subtitle">
                                Learn how CampusVoice works
                            </div>

                        </div>

                    </a>

                </div>


                <div
                    class="card"
                    style="margin-top: 18px;"
                >

                    <div class="card-head">

                        <div>

                            <h3 class="card-title">
                                Concern Activity
                            </h3>

                            <div class="card-subtitle">
                                Your latest submitted concerns
                            </div>

                        </div>

                        <a
                            class="link"
                            href="concerns.html"
                        >
                            View all →
                        </a>

                    </div>


                    <div class="table-wrap">

                        <table class="table">

                            <thead>

                                <tr>

                                    <th>
                                        Concern
                                    </th>

                                    <th>
                                        Submitted
                                    </th>

                                    <th>
                                        Status
                                    </th>

                                    <th>
                                        Priority
                                    </th>

                                    <th></th>

                                </tr>

                            </thead>


                            <tbody>

                                ${
                                    rows ||
                                    `
                                        <tr>

                                            <td
                                                colspan="5"
                                                class="empty"
                                            >
                                                No concerns submitted yet.
                                            </td>

                                        </tr>
                                    `
                                }

                            </tbody>

                        </table>

                    </div>

                </div>


                <div
                    class="grid g2"
                    style="margin-top: 18px;"
                >

                    <div class="card">

                        <div class="card-head">

                            <div>

                                <h3 class="card-title">
                                    CampusVoice Updates
                                </h3>

                                <div class="card-subtitle">
                                    Important system information
                                </div>

                            </div>

                        </div>


                        <div class="list">

                            <div class="list-row">

                                <div>

                                    <b>
                                        Concern tracking is now centralized
                                    </b>

                                    <small>
                                        All updates are recorded in
                                        your concern timeline.
                                    </small>

                                </div>

                            </div>


                            <div class="list-row">

                                <div>

                                    <b>
                                        Resolution confirmation
                                    </b>

                                    <small>
                                        Confirm whether a resolved
                                        concern has actually been addressed.
                                    </small>

                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="card">

                        <div class="card-head">

                            <div>

                                <h3 class="card-title">
                                    Notifications
                                </h3>

                                <div class="card-subtitle">
                                    Recent messages
                                </div>

                            </div>

                            <a
                                class="link"
                                href="notifications.html"
                            >
                                View →
                            </a>

                        </div>


                        <div class="list">

                            ${
                                notificationsHtml ||
                                `
                                    <div class="empty">
                                        No new notifications.
                                    </div>
                                `
                            }

                        </div>

                    </div>

                </div>
            `;


            const footer = `

                <footer class="footer">

                    <div class="footer-grid">

                        <div>

                            <h4>
                                CampusVoice
                            </h4>

                            <div class="goldline"></div>

                            <p>
                                A web-based concern management
                                system for City of Malabon University.
                            </p>

                        </div>


                        <div>

                            <h4>
                                Get in Touch
                            </h4>

                            <p>
                                Pampano cor. Maya-Maya Sts.,
                                Longos, Malabon City
                            </p>

                            <p>
                                cmuofficial@cityofmalabonuniversity.edu.ph
                            </p>

                        </div>


                        <div>

                            <h4>
                                Quick Links
                            </h4>

                            <a href="help.html">
                                Help & Support
                            </a>

                            <a href="profile.html">
                                My Profile
                            </a>

                        </div>

                    </div>

                </footer>
            `;


            shell(
                "dashboard.html",
                "Dashboard",
                `Welcome back, ${
                    escapeHtml(profile.first_name)
                }.`,
                content,
                footer
            );
        }


        async function loadDashboard() {

            try {

                const {
                    data: {
                        user
                    },
                    error: userError
                } = await supabaseClient.auth.getUser();


                if (userError || !user) {
                    window.location.href = "../index.html";
                    return;
                }


                const {
                    data: profile,
                    error: profileError
                } = await supabaseClient
                    .from("users")
                    .select(`
                        user_id,
                        first_name,
                        middle_initial,
                        last_name,
                        email,
                        student_id,
                        role,
                        account_status
                    `)
                    .eq("user_id", user.id)
                    .single();


                if (profileError) {
                    console.error(
                        "Profile error:",
                        profileError
                    );

                    throw new Error(
                        "Unable to load your CampusVoice profile."
                    );
                }


                if (
                    profile.role !== "student" ||
                    profile.account_status !== "active"
                ) {
                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "../index.html";

                    return;
                }


                const {
    data: concernData,
    error: concernError
} = await supabaseClient
    .from("concerns")
    .select(`
        concern_id,
        concern_code,
        student_id,
        title,
        date_submitted,
        status_id,
        priority_id,
        category_id,
        location_id
    `)
    .eq("student_id", user.id)
    .order("date_submitted", {
        ascending: false
    });

if (concernError) {
    console.error("Concern error:", concernError);
    throw new Error("Unable to load your concerns.");
}

const concerns = concernData || [];


                const statusIds = [
                    ...new Set(
                        concerns
                            .map(
                                concern =>
                                    concern.status_id
                            )
                            .filter(Boolean)
                    )
                ];


                const categoryIds = [
                    ...new Set(
                        concerns
                            .map(
                                concern =>
                                    concern.category_id
                            )
                            .filter(Boolean)
                    )
                ];


                const locationIds = [
                    ...new Set(
                        concerns
                            .map(
                                concern =>
                                    concern.location_id
                            )
                            .filter(Boolean)
                    )
                ];


                const priorityIds = [
                    ...new Set(
                        concerns
                            .map(
                                concern =>
                                    concern.priority_id
                            )
                            .filter(Boolean)
                    )
                ];


                const [
                    statusResult,
                    categoryResult,
                    locationResult,
                    priorityResult
                ] = await Promise.all([

                    supabaseClient
                        .from("statuses")
                        .select(
                            "status_id,status_name"
                        )
                        .in(
                            "status_id",
                            statusIds.length
                                ? statusIds
                                : [-1]
                        ),

                    supabaseClient
                        .from("categories")
                        .select(
                            "category_id,category_name"
                        )
                        .in(
                            "category_id",
                            categoryIds.length
                                ? categoryIds
                                : [-1]
                        ),

                    supabaseClient
                        .from("locations")
                        .select(
                            "location_id,building,floor,area"
                        )
                        .in(
                            "location_id",
                            locationIds.length
                                ? locationIds
                                : [-1]
                        ),

                    supabaseClient
                        .from("priorities")
                        .select(
                            "priority_id,priority_name"
                        )
                        .in(
                            "priority_id",
                            priorityIds.length
                                ? priorityIds
                                : [-1]
                        )
                ]);


                if (statusResult.error) {
                    throw statusResult.error;
                }

                if (categoryResult.error) {
                    throw categoryResult.error;
                }

                if (locationResult.error) {
                    throw locationResult.error;
                }

                if (priorityResult.error) {
                    throw priorityResult.error;
                }


                const statuses =
                    statusResult.data || [];

                const categories =
                    categoryResult.data || [];

                const locations =
                    locationResult.data || [];

                const priorities =
                    priorityResult.data || [];


                const statusMap =
                    Object.fromEntries(
                        statuses.map(status => [
                            status.status_id,
                            status.status_name
                        ])
                    );


                const categoryMap =
                    Object.fromEntries(
                        categories.map(category => [
                            category.category_id,
                            category.category_name
                        ])
                    );


                const locationMap =
                    Object.fromEntries(
                        locations.map(location => [
                            location.location_id,
                            location
                        ])
                    );


                const priorityMap =
                    Object.fromEntries(
                        priorities.map(priority => [
                            priority.priority_id,
                            priority.priority_name
                        ])
                    );


                const formattedConcerns =
                    concerns.map(concern => {

                        const location =
                            locationMap[
                                concern.location_id
                            ] || {};


                        return {

                            ...concern,

                            status:
                                statusMap[
                                    concern.status_id
                                ] || "Submitted",

                            category:
                                categoryMap[
                                    concern.category_id
                                ] || "—",

                            building:
                                location.building || "—",

                            priority:
                                priorityMap[
                                    concern.priority_id
                                ] || "To be assessed"
                        };
                    });


                
const {
    data: notificationData,
    error: notificationError
} = await supabaseClient
    .from("notifications")
    .select("notification_id, user_id, concern_id, title, message, is_read, created_at")
    .eq("user_id", user.id)
    .order("created_at", { ascending: false })
    .limit(10);

if (notificationError) {
    throw notificationError;
}

renderDashboard(
    profile,
    formattedConcerns,
    notificationData || []
);


            } catch (error) {

                console.error(
                    "CampusVoice dashboard error:",
                    error
                );


                document.body.innerHTML = `

                    <div
                        style="
                            min-height:100vh;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            padding:24px;
                            font-family:Arial,sans-serif;
                        "
                    >

                        <div
                            style="
                                max-width:520px;
                                width:100%;
                                padding:32px;
                                border:1px solid #e5e7eb;
                                border-radius:18px;
                                text-align:center;
                                background:#fff;
                            "
                        >

                            <h2>
                                Unable to load Dashboard
                            </h2>

                            <p>
                                ${
                                    escapeHtml(
                                        error.message
                                    )
                                }
                            </p>

                            <button
                                class="btn"
                                onclick="location.reload()"
                            >
                                Try Again
                            </button>

                        </div>

                    </div>
                `;
            }
        }


        document.addEventListener(
            "DOMContentLoaded",
            loadDashboard
        );
    </script>

</body>

</html>

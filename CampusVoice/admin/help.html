<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help & Support | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>const content=`<div class="grid g2"><div class="card"><h3 class="card-title">Administrator Guide</h3><div class="list"><div class="list-row"><div><b>Review and prioritize</b><small>Use category, location, priority, and status filters together.</small></div></div><div class="list-row"><div><b>Assign and reassign</b><small>Consider staff eligibility and active workload before assigning.</small></div></div><div class="list-row"><div><b>Monitor resolution</b><small>Verify action taken and evidence before closing a concern.</small></div></div><div class="list-row"><div><b>Manage records</b><small>Deactivate users, categories, and locations rather than deleting historical data.</small></div></div></div></div><div class="card"><h3 class="card-title">Resolution Targets</h3><p class="card-subtitle" style="line-height:1.7;margin-top:10px">Initial prototype targets should be treated as configurable guidance, not official CMU policy.</p><div class="list"><div class="list-row"><div><b>Urgent / Safety</b><small>Action within 24 hours; target resolution 1–3 working days.</small></div></div><div class="list-row"><div><b>High</b><small>Action within 1 working day; target resolution 3–5 working days.</small></div></div><div class="list-row"><div><b>Medium / Routine</b><small>Action within 1–2 working days; target resolution 3–7 working days.</small></div></div><div class="list-row"><div><b>Complex / Resource Dependent</b><small>Acknowledge promptly; resolution depends on materials, procurement, funding, or external assistance.</small></div></div></div></div></div>`;shell('help.html','Help & Support','Administrative guides and operating rules.',content,'');</script></body></html>

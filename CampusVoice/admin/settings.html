
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>System Settings | CampusVoice</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/demo-data.js"></script>
<script src="../js/shell.js"></script>

<script>
"use strict";



const supabaseClient = window.campusVoiceSupabase;




const defaults = {
    start: "09:00",
    end: "16:00",
    weekdays: true,
    weekends: false,
    notify: true,

    targets: {
        Urgent: "1–3 working days",
        High: "3–5 working days",
        Medium: "3–7 working days",
        Low: "Up to 7 working days"
    }
};

const settings = {
    ...defaults,
    ...JSON.parse(
        localStorage.getItem("cv_settings") || "{}"
    )
};

settings.targets = {
    ...defaults.targets,
    ...(settings.targets || {})
};

function save() {
    localStorage.setItem(
        "cv_settings",
        JSON.stringify(settings)
    );
}


//helpers

function fmt(time) {
    const [hours, minutes] = time.split(":").map(Number);

    const period = hours >= 12 ? "PM" : "AM";
    const displayHours = hours % 12 || 12;

    return `${displayHours}:${String(minutes).padStart(2, "0")} ${period}`;
}

function safe(value) {
    return typeof esc === "function"
        ? esc(String(value ?? ""))
        : String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
}


//workingschedule

function render() {
    document.getElementById("schedule").innerHTML = `
        <div class="setting-row">
            <div>
                <b>Monday–Friday</b>
                <small>Working days</small>
            </div>

            <button
                class="switch ${settings.weekdays ? "on" : ""}"
                id="weekdays"
                type="button">
            </button>
        </div>

        <div class="setting-row">
            <div>
                <b>${fmt(settings.start)} – ${fmt(settings.end)}</b>
                <small>Configured working hours</small>
            </div>

            <button class="btn small" id="hours" type="button">
                Edit
            </button>
        </div>

        <div class="setting-row">
            <div>
                <b>Saturday / Sunday</b>
                <small>Non-working days</small>
            </div>

            <button
                class="switch ${settings.weekends ? "on" : ""}"
                id="weekends"
                type="button">
            </button>
        </div>
    `;

    document.getElementById("weekdays").onclick = () => {
        settings.weekdays = !settings.weekdays;
        save();
        render();
    };

    document.getElementById("weekends").onclick = () => {
        settings.weekends = !settings.weekends;
        save();
        render();
    };

    document.getElementById("hours").onclick = editHours;

    document.getElementById("notifyStatus").textContent =
        settings.notify ? "Enabled" : "Disabled";

    document.getElementById("notifyToggle").className =
        "switch " + (settings.notify ? "on" : "");
}


//pagecontent

const content = `
    <div class="grid g2">

        <div class="card">
            <div class="card-head">
                <div>
                    <h3 class="card-title">Working Schedule</h3>
                    <div class="card-subtitle">
                        Configurable processing schedule for resolution timers.
                    </div>
                </div>
            </div>

            <div id="schedule"></div>
        </div>

        <div class="card">
            <div class="card-head">
                <div>
                    <h3 class="card-title">System Configuration</h3>
                    <div class="card-subtitle">
                        Super Admin controls.
                    </div>
                </div>
            </div>

            <div class="setting-row">
                <div>
                    <b>Resolution Targets</b>
                    <small>
                        Priority-based target response/resolution guidance
                    </small>
                </div>

                <button
                    class="btn small settings-action"
                    id="targets"
                    type="button">
                    Configure
                </button>
            </div>

            <div class="setting-row">
                <div>
                    <b>Holiday Calendar</b>
                    <small>
                        Exclude non-working holidays from processing timers
                    </small>
                </div>

                <button
                    class="btn small settings-action"
                    id="holiday"
                    type="button">
                    Manage
                </button>
            </div>

            <div class="setting-row">
                <div>
                    <b>Notification Settings</b>
                    <small id="notifyStatus">
                        System-generated in-app notifications
                    </small>
                </div>

                <button
                    class="switch"
                    id="notifyToggle"
                    type="button">
                </button>
            </div>
        </div>

    </div>

    <div class="alert warn" style="margin-top:18px">
        9:00 AM–4:00 PM is an initial prototype setting based on the
        current project decision. Confirm official CMU operating hours
        before treating it as policy.
    </div>
`;

shell(
    "settings.html",
    "System Settings",
    "Configure working hours, resolution targets, holidays, and notifications.",
    content,
    ""
);

render();

document.getElementById("notifyToggle").onclick = () => {
    settings.notify = !settings.notify;
    save();
    render();
};


//editworkinghours

function editHours() {
    const box = modal(
        "Edit Working Hours",

        `
            <div class="form-grid">
                <div class="field">
                    <label>Start Time</label>
                    <input id="s" type="time" value="${settings.start}">
                </div>

                <div class="field">
                    <label>End Time</label>
                    <input id="e" type="time" value="${settings.end}">
                </div>
            </div>
        `,

        `
            <button class="btn primary" id="saveHours" type="button">
                Save
            </button>
        `
    );

    box.querySelector("#saveHours").onclick = () => {
        const start = box.querySelector("#s").value;
        const end = box.querySelector("#e").value;

        if (!start || !end || start >= end) {
            toast("Please enter valid working hours.");
            return;
        }

        settings.start = start;
        settings.end = end;

        save();
        box.remove();
        render();

        toast("Working hours updated.");
    };
}


//resolutiontarget

document.getElementById("targets").onclick = () => {
    const fields = Object.entries(settings.targets)
        .map(([priority, value]) => `
            <div class="field" style="margin-bottom:10px">
                <label>${safe(priority)} Priority</label>
                <input
                    data-target="${safe(priority)}"
                    value="${safe(value)}">
            </div>
        `)
        .join("");

    const box = modal(
        "Resolution Targets",
        fields,
        `
            <button class="btn primary" id="saveTargets" type="button">
                Save Targets
            </button>
        `
    );

    box.querySelector("#saveTargets").onclick = () => {
        box.querySelectorAll("[data-target]").forEach(input => {
            settings.targets[input.dataset.target] = input.value.trim();
        });

        save();
        box.remove();

        toast("Resolution targets updated.");
    };
};


//holidaycalendarsupabase

document.getElementById("holiday").onclick = openHolidayCalendar;

async function openHolidayCalendar() {
    const box = modal(
        "Holiday Calendar",

        `
            <div class="field">
                <label for="holidayDate">Add non-working date</label>
                <input id="holidayDate" type="date">
            </div>

            <div
                id="holidayMessage"
                class="card-subtitle"
                role="status"
                style="margin-top:10px">
            </div>

            <div
                id="holidayList"
                class="list"
                style="margin-top:12px">
                <div class="empty">Loading holidays...</div>
            </div>
        `,

        `
            <button class="btn primary" id="addHoliday" type="button">
                Add Date
            </button>
        `
    );

    const list = box.querySelector("#holidayList");
    const message = box.querySelector("#holidayMessage");
    const dateInput = box.querySelector("#holidayDate");
    const addButton = box.querySelector("#addHoliday");

    async function loadHolidays() {
        if (!supabaseClient) {
            list.innerHTML =
                '<div class="empty">Supabase client is unavailable.</div>';

            message.textContent =
                "Check js/supabase-config.js.";

            addButton.disabled = true;
            return;
        }

        const { data, error } = await supabaseClient
            .from("holidays")
            .select("holiday_id, holiday_date, holiday_name, active")
            .order("holiday_date", { ascending: true });

        if (error) {
            console.error("Load holidays error:", error);

            list.innerHTML =
                '<div class="empty">Unable to load holidays.</div>';

            message.textContent = error.message;
            return;
        }

        const holidays = (data || []).filter(
            holiday => holiday.active !== false
        );

        list.innerHTML = holidays.length
            ? holidays.map(holiday => `
                <div class="list-row">
                    <div>
                        <b>${safe(holiday.holiday_date)}</b>
                        <small>
                            ${safe(holiday.holiday_name || "Non-working day")}
                        </small>
                    </div>

                    <button
                        class="btn small"
                        type="button"
                        data-remove="${safe(holiday.holiday_id)}">
                        Remove
                    </button>
                </div>
            `).join("")
            : '<div class="empty">No holidays configured.</div>';

        list.querySelectorAll("[data-remove]").forEach(button => {
            button.onclick = async () => {
                button.disabled = true;

                const { error } = await supabaseClient
                    .from("holidays")
                    .update({ active: false })
                    .eq("holiday_id", button.dataset.remove);

                if (error) {
                    console.error("Remove holiday error:", error);
                    toast("Unable to remove holiday.");
                    button.disabled = false;
                    return;
                }

                toast("Holiday removed.");
                await loadHolidays();
            };
        });
    }

    addButton.onclick = async () => {
        const date = dateInput.value;

        if (!date) {
            toast("Select a date.");
            return;
        }

        if (!supabaseClient) {
            toast("Supabase client is unavailable.");
            return;
        }

        addButton.disabled = true;

        try {
            const { data: existing, error: checkError } =
                await supabaseClient
                    .from("holidays")
                    .select("holiday_id")
                    .eq("holiday_date", date)
                    .eq("active", true)
                    .limit(1);

            if (checkError) {
                throw checkError;
            }

            if (existing && existing.length > 0) {
                toast("This holiday already exists.");
                return;
            }

            const { error: insertError } = await supabaseClient
                .from("holidays")
                .insert({
                    holiday_date: date,
                    holiday_name: "Non-working day",
                    active: true
                });

            if (insertError) {
                throw insertError;
            }

            toast("Holiday saved to Supabase.");

            dateInput.value = "";
            message.textContent = "";

            await loadHolidays();

        } catch (error) {
            console.error("Add holiday error:", error);

            message.textContent =
                error.message || "Unable to save holiday.";

            toast("Unable to save holiday. Check Console and RLS policies.");

        } finally {
            addButton.disabled = false;
        }
    };

    await loadHolidays();
}
</script>

</body>
</html>

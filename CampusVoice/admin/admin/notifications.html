<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="initial-scale=1"><title>Notifications | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>function render(){const list=CV.notifications.filter(n=>n.role==='admin');document.getElementById('noticeList').innerHTML=list.map(n=>`<div class="notice clickable ${n.read?'':'unread'}" onclick="cvOpenNotification(CV.notifications.find(x=>x.id==='${n.id}'))"><span class="notice-dot"></span><div><b>${esc(n.title)}</b><p>${esc(n.message)}</p><small>${n.time}${n.read?'':' · New'}</small></div><span class="link">${n.target?'View →':''}</span></div>`).join('')||'<div class="empty">No notifications.</div>'}const content=`<div class="card"><div class="card-head"><div><h3 class="card-title">Notifications</h3><div class="card-subtitle">System alerts and administrative updates.</div></div><button class="btn small" id="markRead">Mark all as read</button></div><div id="noticeList" class="notification-list"></div></div>`;shell('notifications.html','Notifications','System alerts and administrative updates.',content,'');document.getElementById('markRead').onclick=()=>{CV.notifications.filter(n=>n.role==='admin').forEach(n=>n.read=true);cvSave();render();toast('All notifications marked as read.');};render();</script></body></html>

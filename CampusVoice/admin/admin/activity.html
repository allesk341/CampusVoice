<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Activity | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>const actions=['Concern Submitted','Staff Assigned','Status Updated','Priority Changed','User Created','Category Updated','Location Updated','Admin Note Added'];const seed=[{time:'Oct 6, 9:12 AM',user:'Joy De Guzman',role:'Super Admin',action:'Staff Assigned',ref:'CV-2026-0001',details:'Assigned to Pedro Santos'},{time:'Oct 5, 3:45 PM',user:'Pedro Santos',role:'Staff',action:'Status Updated',ref:'CV-2026-0001',details:'Changed to In Progress'},{time:'Oct 4, 10:18 AM',user:'Juan Dela Cruz',role:'Student',action:'Concern Submitted',ref:'CV-2026-0002',details:'New concern submitted'}];const content=`<div class="toolbar"><input id="q" placeholder="Search user, action, reference..."><select id="role"><option>All Roles</option><option>Student</option><option>Staff</option><option>Administrator</option><option>Super Admin</option></select><select id="act"><option>All Actions</option>${actions.map(x=>`<option>${x}</option>`).join('')}</select><input id="date" type="date"><button class="btn" id="filter">Filter</button></div><div class="card"><div class="card-head"><div><h3 class="card-title">System Activity</h3><div class="card-subtitle">Audit trail for important system and administrative actions.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Date & Time</th><th>User</th><th>Role</th><th>Action</th><th>Reference</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="alert info" style="margin-top:15px">Activity logs should be immutable in the production database. Authorized administrators can view them but should not edit or delete them.</div>`;shell('activity.html','System Activity','Audit trail for important system and administrative actions.',content,'');function render(){const q=document.getElementById('q').value.toLowerCase(),r=document.getElementById('role').value,a=document.getElementById('act').value,rows=seed.filter(x=>(!q||[x.user,x.action,x.ref,x.details].join(' ').toLowerCase().includes(q))&&(r==='All Roles'||x.role===r)&&(a==='All Actions'||x.action===a));document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${x.time}</td><td>${esc(x.user)}</td><td>${esc(x.role)}</td><td>${esc(x.action)}</td><td>${esc(x.ref)}</td><td>${esc(x.details)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No activity found.</td></tr>'}document.getElementById('filter').onclick=render;render();</script></body></html>

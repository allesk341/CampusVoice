<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>All Concerns | CampusVoice</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

<script src="../js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/shell.js"></script>

<script>

const supabaseClient =
    supabase.createClient(
        window.CAMPUSVOICE_SUPABASE.url,
        window.CAMPUSVOICE_SUPABASE.publishableKey
    );

let concerns = [];
let categories = [];
let statuses = [];
let priorities = [];
let locations = [];
let staffUsers = [];

const params =
    new URLSearchParams(location.search);

const quick =
    params.get("filter") || "";

function statusName(id) {

    const item =
        statuses.find(
            status =>
                status.status_id === id
        );

    return item
        ? item.status_name
        : "—";
}

function categoryName(id) {

    const item =
        categories.find(
            category =>
                category.category_id === id
        );

    return item
        ? item.category_name
        : "—";
}

function priorityName(id) {

    const item =
        priorities.find(
            priority =>
                priority.priority_id === id
        );

    return item
        ? item.priority_name
        : "—";
}

function locationName(id) {

    const item =
        locations.find(
            location =>
                location.location_id === id
        );

    if (!item) {
        return "—";
    }

    return [
        item.building,
        item.area
    ]
        .filter(Boolean)
        .join(" · ");
}

function staffName(id) {

    const item =
        staffUsers.find(
            staff =>
                staff.user_id === id
        );

    if (!item) {
        return "Unassigned";
    }

    return [
        item.first_name,
        item.middle_initial,
        item.last_name
    ]
        .filter(Boolean)
        .join(" ");
}

function priorityBadge(name) {

    if (
        name === "Urgent" ||
        name === "High"
    ) {

        return `
            <span class="badge danger">
                ${esc(name)}
            </span>
        `;
    }

    if (name === "Medium") {

        return `
            <span class="badge warn">
                ${esc(name)}
            </span>
        `;
    }

    if (name === "Low") {

        return `
            <span class="badge">
                ${esc(name)}
            </span>
        `;
    }

    return `
        <span class="badge">
            ${esc(name)}
        </span>
    `;
}

function statusBadge(name) {

    return `
        <span class="badge">
            ${esc(name)}
        </span>
    `;
}

async function loadReferenceData() {

    const [
        categoryResult,
        statusResult,
        priorityResult,
        locationResult,
        staffResult
    ] = await Promise.all([

        supabaseClient
            .from("categories")
            .select(
                "category_id,category_name,status"
            )
            .order("category_name"),

        supabaseClient
            .from("statuses")
            .select(
                "status_id,status_name"
            )
            .order("status_id"),

        supabaseClient
            .from("priorities")
            .select(
                "priority_id,priority_name"
            )
            .order("priority_id"),

        supabaseClient
            .from("locations")
            .select(
                "location_id,building,floor,area,status"
            )
            .order("building")
            .order("floor")
            .order("area"),

        supabaseClient
            .from("users")
            .select(
                "user_id,first_name,middle_initial,last_name,role,account_status"
            )
            .eq("role", "staff")
            .eq("account_status", "active")
            .order("last_name")
    ]);

    if (categoryResult.error) {
        throw categoryResult.error;
    }

    if (statusResult.error) {
        throw statusResult.error;
    }

    if (priorityResult.error) {
        throw priorityResult.error;
    }

    if (locationResult.error) {
        throw locationResult.error;
    }

    if (staffResult.error) {
        throw staffResult.error;
    }

    categories =
        categoryResult.data || [];

    statuses =
        statusResult.data || [];

    priorities =
        priorityResult.data || [];

    locations =
        locationResult.data || [];

    staffUsers =
        staffResult.data || [];
}

async function loadConcerns() {

    const {
        data,
        error
    } = await supabaseClient
        .from("concerns")
        .select(`
            concern_id,
            concern_code,
            student_id,
            category_id,
            location_id,
            priority_id,
            status_id,
            title,
            description,
            date_submitted,
            created_at,
            updated_at,
            resolved_at,
            closed_at
        `)
        .order(
            "created_at",
            {
                ascending: false
            }
        );

    if (error) {

        console.error(error);

        toast(
            error.message ||
            "Unable to load concerns."
        );

        return;
    }

    concerns =
        data || [];

    renderConcerns();
}

async function getStudentNames() {

    const studentIds = [
        ...new Set(
            concerns
                .map(
                    concern =>
                        concern.student_id
                )
                .filter(Boolean)
        )
    ];

    if (!studentIds.length) {
        return {};
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("users")
        .select(
            "user_id,student_id,first_name,middle_initial,last_name"
        )
        .in(
            "user_id",
            studentIds
        );

    if (error) {

        console.error(error);

        return {};
    }

    const map = {};

    (data || []).forEach(user => {

        map[user.user_id] = {
            name: [
                user.first_name,
                user.middle_initial,
                user.last_name
            ]
                .filter(Boolean)
                .join(" "),

            studentId:
                user.student_id || "—"
        };

    });

    return map;
}

async function renderConcerns() {

    const studentMap =
        await getStudentNames();

    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    const categoryFilter =
        document.getElementById(
            "category"
        ).value;

    const statusFilter =
        document.getElementById(
            "status"
        ).value;

    const priorityFilter =
        document.getElementById(
            "priority"
        ).value;

    const buildingFilter =
        document.getElementById(
            "building"
        ).value;

    const assignedFilter =
        document.getElementById(
            "assigned"
        ).value;

    const filtered =
        concerns.filter(
            concern => {

                const student =
                    studentMap[
                        concern.student_id
                    ];

                const studentName =
                    student
                        ? student.name
                        : "";

                const studentId =
                    student
                        ? student.studentId
                        : "";

                const category =
                    categoryName(
                        concern.category_id
                    );

                const status =
                    statusName(
                        concern.status_id
                    );

                const priority =
                    priorityName(
                        concern.priority_id
                    );

                const location =
                    locationName(
                        concern.location_id
                    );

                const assigned =
                    "Unassigned";

                const text = [
                    concern.concern_code,
                    concern.title,
                    studentName,
                    studentId,
                    category,
                    location
                ]
                    .join(" ")
                    .toLowerCase();

                const searchMatch =
                    !search ||
                    text.includes(search);

                const categoryMatch =
                    categoryFilter === "All" ||
                    String(
                        concern.category_id
                    ) === categoryFilter;

                const statusMatch =
                    quick === "open"
                        ? ![
                            "Resolved",
                            "Closed",
                            "Cancelled"
                        ].includes(status)
                        : quick === "resolved"
                            ? status === "Resolved"
                            : statusFilter === "All" ||
                              status === statusFilter;

                const priorityMatch =
                    quick === "high"
                        ? [
                            "High",
                            "Urgent"
                        ].includes(priority)
                        : priorityFilter === "All" ||
                          priority === priorityFilter;

                const buildingMatch =
                    buildingFilter === "All" ||
                    location.startsWith(
                        buildingFilter
                    );

                const assignedMatch =
                    assignedFilter === "All" ||
                    assigned === assignedFilter;

                return (
                    searchMatch &&
                    categoryMatch &&
                    statusMatch &&
                    priorityMatch &&
                    buildingMatch &&
                    assignedMatch
                );
            }
        );

    document.getElementById(
        "count"
    ).textContent =
        `${filtered.length} result${
            filtered.length === 1
                ? ""
                : "s"
        }`;

    document.getElementById(
        "rows"
    ).innerHTML =

        filtered.map(
            concern => {

                const student =
                    studentMap[
                        concern.student_id
                    ];

                const studentName =
                    student
                        ? student.name
                        : "Unknown Student";

                const studentId =
                    student
                        ? student.studentId
                        : "—";

                const category =
                    categoryName(
                        concern.category_id
                    );

                const location =
                    locationName(
                        concern.location_id
                    );

                const priority =
                    priorityName(
                        concern.priority_id
                    );

                const status =
                    statusName(
                        concern.status_id
                    );

                return `
                    <tr>

                        <td>
                            <a
                                class="link"
                                href="concern-details.html?id=${encodeURIComponent(
                                    concern.concern_id
                                )}">
                                ${esc(
                                    concern.concern_code ||
                                    concern.concern_id
                                )}
                            </a>
                        </td>

                        <td>

                            <strong>
                                ${esc(
                                    concern.title
                                )}
                            </strong>

                            <br>

                            <span class="card-subtitle">
                                ${esc(
                                    studentName
                                )}
                                ·
                                ${esc(
                                    studentId
                                )}
                            </span>

                        </td>

                        <td>
                            ${esc(category)}
                        </td>

                        <td>
                            ${esc(location)}
                        </td>

                        <td>
                            ${priorityBadge(
                                priority
                            )}
                        </td>

                        <td>
                            ${statusBadge(
                                status
                            )}
                        </td>

                        <td>
                            Unassigned
                        </td>

                        <td>

                            <a
                                class="btn small"
                                href="concern-details.html?id=${encodeURIComponent(
                                    concern.concern_id
                                )}">
                                Open
                            </a>

                        </td>

                    </tr>
                `;

            }
        ).join("") ||

        `
            <tr>

                <td
                    colspan="8"
                    class="empty">
                    No concerns found.
                    Filters use AND logic.
                </td>

            </tr>
        `;
}

const content = `

<div class="toolbar">

    <input
        id="search"
        type="search"
        placeholder="Search Concern ID, student, title, category, location..."
    >

    <select id="category">

        <option value="All">
            All Categories
        </option>

        ${categories
            .filter(
                category =>
                    category.status === "active"
            )
            .map(
                category => `
                    <option
                        value="${category.category_id}">
                        ${esc(
                            category.category_name
                        )}
                    </option>
                `
            )
            .join("")}

    </select>

    <select id="status">

        <option value="All">
            All Statuses
        </option>

        ${statuses
            .map(
                status => `
                    <option
                        value="${esc(
                            status.status_name
                        )}">
                        ${esc(
                            status.status_name
                        )}
                    </option>
                `
            )
            .join("")}

    </select>

    <select id="priority">

        <option value="All">
            All Priorities
        </option>

        ${priorities
            .map(
                priority => `
                    <option
                        value="${esc(
                            priority.priority_name
                        )}">
                        ${esc(
                            priority.priority_name
                        )}
                    </option>
                `
            )
            .join("")}

    </select>

    <select id="building">

        <option value="All">
            All Buildings
        </option>

        ${[
            ...new Set(
                locations.map(
                    location =>
                        location.building
                )
            )
        ]
            .map(
                building => `
                    <option value="${esc(
                        building
                    )}">
                        ${esc(building)}
                    </option>
                `
            )
            .join("")}

    </select>

    <select id="assigned">

        <option value="All">
            All Assigned Staff
        </option>

        <option value="Unassigned">
            Unassigned
        </option>

        ${staffUsers
            .map(
                staff => `
                    <option
                        value="${esc(
                            staff.user_id
                        )}">
                        ${esc(
                            [
                                staff.first_name,
                                staff.middle_initial,
                                staff.last_name
                            ]
                                .filter(Boolean)
                                .join(" ")
                        )}
                    </option>
                `
            )
            .join("")}

    </select>

</div>

<div class="card">

    <div class="card-head">

        <div>

            <h3 class="card-title">
                All Concerns
            </h3>

            <div class="card-subtitle">
                Search, filter, review, prioritize, assign, and monitor every concern.
            </div>

        </div>

        <span
            class="filter-count"
            id="count">
        </span>

    </div>

    <div class="table-wrap">

        <table class="table">

            <thead>

                <tr>

                    <th>
                        Concern ID
                    </th>

                    <th>
                        Concern / Student
                    </th>

                    <th>
                        Category
                    </th>

                    <th>
                        Location
                    </th>

                    <th>
                        Priority
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Assigned Staff
                    </th>

                    <th>
                    </th>

                </tr>

            </thead>

            <tbody id="rows">
            </tbody>

        </table>

    </div>

</div>

`;

shell(
    "concerns.html",
    "All Concerns",
    "Centralized concern monitoring with combined filters.",
    content,
    ""
);

async function initializePage() {

    const {
        data: {
            user
        },
        error
    } =
        await supabaseClient.auth.getUser();

    if (
        error ||
        !user
    ) {

        window.location.href =
            "../index.html";

        return;
    }

    try {

        await loadReferenceData();

        await loadConcerns();

    } catch (error) {

        console.error(error);

        toast(
            error.message ||
            "Unable to load concern data."
        );
    }

    if (
        quick === "open" ||
        quick === "resolved"
    ) {

        document
            .getElementById("status")
            .disabled = true;
    }

    if (quick === "high") {

        document
            .getElementById("priority")
            .disabled = true;
    }
}

[
    "search",
    "category",
    "status",
    "priority",
    "building",
    "assigned"
].forEach(
    id => {

        document
            .getElementById(id)
            .addEventListener(
                "input",
                renderConcerns
            );

        document
            .getElementById(id)
            .addEventListener(
                "change",
                renderConcerns
            );
    }
);

initializePage();

</script>

</body>
</html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>const u=cvCurrentUser();const content=`<div class="card form-card"><div class="profile-top"><div class="profile-photo-wrap">${avatarMarkup('profile-picture-preview')}<div><h2>${esc(cvName())}</h2><p>Super Admin · ${esc(u.id)} · ${esc(u.department||'Administration')}</p></div></div></div><div class="form-grid" style="margin-top:18px"><div class="field"><label>First Name</label><input value="${esc(u.firstName)}" disabled></div><div class="field"><label>Middle Initial</label><input value="${esc(u.middleInitial||'')}" disabled></div><div class="field"><label>Last Name</label><input value="${esc(u.lastName)}" disabled></div><div class="field"><label>Admin ID</label><input value="${esc(u.id)}" disabled></div><div class="field"><label>Email</label><input value="${esc(u.email)}" disabled></div><div class="field"><label>Role</label><input value="Super Admin" disabled></div><div class="field"><label>Contact Number</label><input id="contact" value="${esc(u.contact||'')}" placeholder="09XXXXXXXXX"></div><div class="field"><label>Profile Picture</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div class="hint">Your photo will appear in the profile and top-right account area.</div></div><div class="field full"><label>New Password</label><input id="password" type="password" placeholder="Leave blank to keep current password"></div></div><div class="info-grid" style="margin-top:18px"><div class="info-box"><small>LAST LOGIN</small><b>Today</b></div><div class="info-box"><small>ACCOUNT STATUS</small><b>Active</b></div></div><div class="form-actions"><button class="btn primary" id="saveProfile">Save Changes</button></div></div>`;shell('profile.html','Profile','Manage your administrator account.',content,'');document.getElementById('saveProfile').onclick=()=>{const p=document.getElementById('password').value.trim();cvSetProfile({contact:document.getElementById('contact').value.trim()});if(p)localStorage.setItem('cv_password_'+u.email,p);toast('Profile changes saved.')};document.getElementById('photo').onchange=e=>cvReadFile(e.target.files[0],data=>{if(data){cvSetProfile({profilePhoto:data});location.reload()}});</script></body></html>

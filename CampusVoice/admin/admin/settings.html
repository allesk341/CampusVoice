<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>System Settings | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>const defaults={start:'09:00',end:'16:00',weekdays:true,weekends:false,notify:true,targets:{Urgent:'1–3 working days',High:'3–5 working days',Medium:'3–7 working days',Low:'Up to 7 working days'}};const settings=JSON.parse(localStorage.getItem('cv_settings')||JSON.stringify(defaults));function save(){localStorage.setItem('cv_settings',JSON.stringify(settings))}function render(){document.getElementById('schedule').innerHTML=`<div class="setting-row"><div><b>Monday–Friday</b><small>Working days</small></div><button class="switch ${settings.weekdays?'on':''}" id="weekdays" type="button"></button></div><div class="setting-row"><div><b>${fmt(settings.start)} – ${fmt(settings.end)}</b><small>Configured working hours</small></div><button class="btn small" id="hours">Edit</button></div><div class="setting-row"><div><b>Saturday / Sunday</b><small>Non-working days</small></div><button class="switch ${settings.weekends?'on':''}" id="weekends" type="button"></button></div>`;document.getElementById('weekdays').onclick=()=>{settings.weekdays=!settings.weekdays;save();render()};document.getElementById('weekends').onclick=()=>{settings.weekends=!settings.weekends;save();render()};document.getElementById('hours').onclick=editHours;document.getElementById('notifyStatus').textContent=settings.notify?'Enabled':'Disabled';document.getElementById('notifyToggle').className='switch '+(settings.notify?'on':'');}function fmt(t){const [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM',hh=(h%12)||12;return `${hh}:${String(m).padStart(2,'0')} ${ap}`}const content=`<div class="grid g2"><div class="card"><div class="card-head"><div><h3 class="card-title">Working Schedule</h3><div class="card-subtitle">Configurable processing schedule for resolution timers.</div></div></div><div id="schedule"></div></div><div class="card"><div class="card-head"><div><h3 class="card-title">System Configuration</h3><div class="card-subtitle">Super Admin controls.</div></div></div><div class="setting-row"><div><b>Resolution Targets</b><small>Priority-based target response/resolution guidance</small></div><button class="btn small settings-action" id="targets">Configure</button></div><div class="setting-row"><div><b>Holiday Calendar</b><small>Exclude non-working holidays from processing timers</small></div><button class="btn small settings-action" id="holiday">Manage</button></div><div class="setting-row"><div><b>Notification Settings</b><small id="notifyStatus">System-generated in-app notifications</small></div><button class="switch" id="notifyToggle" type="button"></button></div></div></div><div class="alert warn" style="margin-top:18px">9:00 AM–4:00 PM is an initial prototype setting based on the current project decision. Confirm official CMU operating hours before treating it as policy.</div>`;shell('settings.html','System Settings','Configure working hours, resolution targets, holidays, and notifications.',content,'');render();document.getElementById('notifyToggle').onclick=()=>{settings.notify=!settings.notify;save();render()};function editHours(){const b=modal('Edit Working Hours',`<div class="form-grid"><div class="field"><label>Start Time</label><input id="s" type="time" value="${settings.start}"></div><div class="field"><label>End Time</label><input id="e" type="time" value="${settings.end}"></div></div>`,`<button class="btn primary" id="saveHours">Save</button>`);b.querySelector('#saveHours').onclick=()=>{settings.start=b.querySelector('#s').value;settings.end=b.querySelector('#e').value;save();b.remove();render();toast('Working hours updated.')}}document.getElementById('targets').onclick=()=>{const b=modal('Resolution Targets',Object.entries(settings.targets).map(([k,v])=>`<div class="field" style="margin-bottom:10px"><label>${k} Priority</label><input data-target="${k}" value="${esc(v)}"></div>`).join(''),`<button class="btn primary" id="saveTargets">Save Targets</button>`);b.querySelector('#saveTargets').onclick=()=>{b.querySelectorAll('[data-target]').forEach(i=>settings.targets[i.dataset.target]=i.value.trim());save();b.remove();toast('Resolution targets updated.')}};document.getElementById('holiday').onclick=()=>{const holidays=JSON.parse(localStorage.getItem('cv_holidays')||'[]');const b=modal('Holiday Calendar',`<div class="field"><label>Add non-working date</label><input id="d" type="date"></div><div class="list" style="margin-top:12px">${holidays.map((h,i)=>`<div class="list-row"><div><b>${h.date}</b><small>${esc(h.name||'Non-working day')}</small></div><button class="btn small" onclick="removeHoliday(${i})">Remove</button></div>`).join('')||'<div class="empty">No holidays configured.</div>'}</div>`,`<button class="btn primary" id="addHoliday">Add Date</button>`);b.querySelector('#addHoliday').onclick=()=>{const d=b.querySelector('#d').value;if(!d)return toast('Select a date.');holidays.push({date:d,name:'Non-working day'});localStorage.setItem('cv_holidays',JSON.stringify(holidays));b.remove();document.getElementById('holiday').click();toast('Holiday added.')};window.removeHoliday=i=>{holidays.splice(i,1);localStorage.setItem('cv_holidays',JSON.stringify(holidays));b.remove();document.getElementById('holiday').click()}};</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>let reportRows=[];function getFiltered(){const from=document.getElementById('from').value,to=document.getElementById('to').value,cat=document.getElementById('cat').value,loc=document.getElementById('loc').value,status=document.getElementById('status').value,staff=document.getElementById('staff').value;return CV.concerns.filter(c=>(!from||c.date>=from)&&(!to||c.date<=to)&&(cat==='All'||c.category===cat)&&(loc==='All'||c.building===loc)&&(status==='All'||c.status===status)&&(staff==='All'||c.assigned===staff))}function render(data=reportRows.length?reportRows:getFiltered()){reportRows=data;const total=data.length,open=data.filter(c=>!['Resolved','Closed','Cancelled'].includes(c.status)).length,res=data.filter(c=>c.status==='Resolved').length;document.getElementById('total').textContent=total;document.getElementById('open').textContent=open;document.getElementById('resolved').textContent=res;const counts=CV.categories.map(x=>({x,n:data.filter(c=>c.category===x).length})).filter(x=>x.n);document.getElementById('catReport').innerHTML=counts.length?counts.map(x=>`<div class="report-item"><div><b>${esc(x.x)}</b><span>${x.n}</span></div><div class="progress"><i style="width:${total?Math.max(3,x.n/total*100):0}%"></i></div></div>`).join(''):'<div class="empty">No concerns match the selected filters.</div>';const locs=[...new Set(data.map(c=>c.building))].map(x=>({x,n:data.filter(c=>c.building===x).length}));document.getElementById('locReport').innerHTML=locs.length?locs.map(x=>`<div class="report-item"><div><b>${esc(x.x)}</b><span>${x.n}</span></div><div class="progress"><i style="width:${total?Math.max(3,x.n/total*100):0}%"></i></div></div>`).join(''):'<div class="empty">No location data.</div>';const staff=[...new Set(data.filter(c=>c.assigned&&c.assigned!=='Unassigned').map(c=>c.assigned))].map(x=>({x,n:data.filter(c=>c.assigned===x).length,r:data.filter(c=>c.assigned===x&&c.status==='Resolved').length}));document.getElementById('staffReport').innerHTML=staff.length?staff.map(x=>`<div class="report-item"><div><b>${esc(x.x)}</b><span>${x.r}/${x.n} resolved</span></div><div class="progress"><i style="width:${x.n?x.r/x.n*100:0}%"></i></div></div>`).join(''):'<div class="empty">No assigned staff data.</div>';document.getElementById('resourceCount').textContent=data.filter(c=>c.status==='Waiting for Resources').length;document.getElementById('generatedInfo').textContent=`Showing ${total} concern${total===1?'':'s'} based on the selected filters.`}const content=`<div class="toolbar"><input id="from" type="date" title="From date"><input id="to" type="date" title="To date"><select id="cat"><option>All</option>${CV.categories.map(x=>`<option>${x}</option>`).join('')}</select><select id="loc"><option>All</option>${CV.buildings.map(x=>`<option>${x}</option>`).join('')}</select><select id="status"><option>All</option>${['Submitted','Under Review','Assigned','In Progress','Waiting for Resources','Resolved','Reopened','Closed','Cancelled'].map(x=>`<option>${x}</option>`).join('')}</select><select id="staff"><option>All</option>${CV.users.filter(u=>u.role==='Staff').map(u=>`<option>${esc(cvFullName(u))}</option>`).join('')}</select><button class="btn primary" id="generate">Generate Report</button><button class="btn" id="print">Print</button><button class="btn" id="export">Export CSV</button></div><div class="alert info" id="generatedInfo">Choose filters and click Generate Report to refresh the report.</div><div class="grid g3"><div class="card clickable-card" onclick="location.href='concerns.html'" title="Open all concerns"><div class="metric-label">TOTAL SUBMITTED</div><div id="total" class="metric-value">${CV.concerns.length}</div><div class="metric-note">Click to open concern records</div></div><div class="card clickable-card" onclick="location.href='concerns.html?filter=open'" title="Open active concerns"><div class="metric-label">OPEN</div><div id="open" class="metric-value">${CV.concerns.filter(c=>!['Resolved','Closed','Cancelled'].includes(c.status)).length}</div><div class="metric-note">Active concerns</div></div><div class="card clickable-card" onclick="location.href='concerns.html?filter=resolved'" title="Open resolved concerns"><div class="metric-label">RESOLVED</div><div id="resolved" class="metric-value">${CV.concerns.filter(c=>c.status==='Resolved').length}</div><div class="metric-note">Resolved concerns</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="card-head"><div><h3 class="card-title">Category Report</h3><div class="card-subtitle">Concern volume by category.</div></div></div><div id="catReport" class="report-grid"></div></div><div class="card"><div class="card-head"><div><h3 class="card-title">Location Report</h3><div class="card-subtitle">Concern volume by building.</div></div></div><div id="locReport" class="report-grid"></div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="card-head"><div><h3 class="card-title">Staff Performance</h3><div class="card-subtitle">Assignment workload and current outcomes.</div></div></div><div id="staffReport" class="report-grid"></div></div><div class="card"><div class="card-head"><div><h3 class="card-title">Resolution Performance</h3><div class="card-subtitle">Operational indicators from the current concern data.</div></div></div><div class="list"><div class="list-row"><div><b>Average Resolution Time</b><small>Will use actual status timestamps when the backend is connected.</small></div><strong>—</strong></div><div class="list-row"><div><b>First Response Time</b><small>Time from submission to first staff/admin response.</small></div><strong>—</strong></div><div class="list-row"><div><b>Waiting for Resources</b><small>Procurement, funding, material, or external assistance delays.</small></div><strong id="resourceCount">0</strong></div></div></div></div>`;shell('reports.html','Reports','Management reports, analytics, and operational performance.',content,'');render();document.getElementById('generate').onclick=()=>{reportRows=[];render(getFiltered());toast('Report generated successfully.')};document.getElementById('print').onclick=()=>window.print();document.getElementById('export').onclick=()=>{const rows=[['Concern ID','Student','Category','Building','Area','Priority','Status','Assigned Staff','Date'],...reportRows.map(c=>[c.id,c.student,c.category,c.building,c.area,c.priority,c.status,c.assigned,c.date])];const csv=rows.map(r=>r.map(v=>'\"'+String(v??'').replaceAll('\"','\"\"')+'\"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CampusVoice_Report.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV report exported.');};</script></body></html>

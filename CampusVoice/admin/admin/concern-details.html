<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Concern Details | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/admin.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'CV-2026-0001';const c=CV.concerns.find(x=>x.id===id)||CV.concerns[0];const staff=['Pedro S. Santos','Ana C. Cruz','Miguel R. Ramos'];const content=`<div class="actions" style="margin-bottom:14px"><a class="btn" href="concerns.html">← Back to All Concerns</a><button class="btn primary" onclick="openAssign()">Assign / Reassign</button></div><div class="detail-grid"><div><div class="card"><div class="card-head"><div><span class="eyebrow" style="color:#2c5ca8">ADMIN CONCERN RECORD</span><h3 class="card-title" style="font-size:19px;margin-top:4px">${esc(c.title)}</h3><div class="card-subtitle">${c.id} · Submitted ${c.date}</div></div><div>${badge(c.status)}</div></div><div class="info-grid"><div class="info-box"><small>STUDENT</small><b>${esc(c.student)}</b></div><div class="info-box"><small>STUDENT ID</small><b>${esc(c.studentId)}</b></div><div class="info-box"><small>EMAIL</small><b>${esc(c.email)}</b></div><div class="info-box"><small>CATEGORY</small><b>${esc(c.category)}</b></div><div class="info-box"><small>LOCATION</small><b>${esc(c.building)} · ${esc(c.floor)}</b></div><div class="info-box"><small>PRIORITY</small><b>${priority(c.priority)}</b></div><div class="info-box"><small>ASSIGNED STAFF</small><b>${esc(c.assigned)}</b></div><div class="info-box"><small>DEPARTMENT</small><b>${esc(c.department||'—')}</b></div></div><div class="detail-section"><h3>Description</h3><p>${esc(c.description)}</p></div><div class="detail-section"><h3>Latest Staff Response</h3><div class="response"><b>${esc(c.assigned)}</b><p>${esc(c.response||'No response yet.')}</p></div></div><div class="detail-section"><h3>Action Taken</h3><p>${esc(c.action||'No action recorded.')}</p></div></div><div class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">Concern History</h3><div class="card-subtitle">Status, assignment, and resolution events.</div></div></div><div class="timeline">${['Submitted','Under Review',c.assigned!=='Unassigned'?'Assigned':null,c.status==='In Progress'||c.status==='Waiting for Resources'||c.status==='Resolved'?'In Progress':null,c.status==='Waiting for Resources'?'Waiting for Resources':null,c.status==='Resolved'?'Resolved':null].filter(Boolean).map((s,i)=>`<div class="timeline-row done"><span class="timeline-dot"></span><div><b>${s}</b><small>${i===0?c.date:'Recorded in system activity'}</small></div></div>`).join('')}</div></div></div><div><div class="card"><h3 class="card-title">Administrative Actions</h3><div class="actions" style="margin-top:14px"><button class="btn" onclick="changePriority()">Change Priority</button><button class="btn" onclick="addNote()">Add Admin Note</button><button class="btn" onclick="verifyResolution()">Verify Resolution</button><button class="btn danger" onclick="closeConcern()">Close Concern</button></div></div><div class="card" style="margin-top:18px"><h3 class="card-title">Evidence Photo</h3><div style="margin-top:12px">${c.photo?`<img class="photo-preview" src="${c.photo}" alt="Concern evidence photo">`:`<div class="photo-box">No supporting / completion evidence has been uploaded.</div>`}</div></div><div class="card" style="margin-top:18px"><h3 class="card-title">Assignment</h3><div class="list"><div class="list-row"><div><b>Current Staff</b><small>${esc(c.assigned)}</small></div><a class="link" href="assignments.html">Manage →</a></div><div class="list-row"><div><b>Assignment History</b><small>Previous assignments remain recorded.</small></div></div></div></div></div></div>`;shell('concerns.html','Concern Details','Administrative review, assignment, priority, resolution, and closure controls.',content,'');function openAssign(){location.href=`assignments.html?concern=${c.id}`}function changePriority(){const b=modal('Change Priority',`<div class="field"><label>Priority</label><select id="p">${CV.priorities.map(x=>`<option ${x===c.priority?'selected':''}>${x}</option>`).join('')}</select></div>`,`<button class="btn primary" id="save">Save Priority</button>`);b.querySelector('#save').onclick=()=>{c.priority=b.querySelector('#p').value;cvAddNotification({title:'Priority Updated',message:`${c.id} priority was changed to ${c.priority}.`,time:'Just now',role:'student',target:c.id,targetStudentId:c.studentId});cvSave();b.remove();toast('Priority updated.');setTimeout(()=>location.reload(),500)}}function addNote(){const b=modal('Add Admin Note',`<div class="field"><label>Admin Note</label><textarea id="n" placeholder="Record an internal administrative note..."></textarea></div>`,`<button class="btn primary" id="save">Save Note</button>`);b.querySelector('#save').onclick=()=>{b.remove();toast('Admin note recorded in activity log.')}}function verifyResolution(){toast('Resolution verification recorded.')}function closeConcern(){c.status='Closed';cvAddNotification({title:'Concern Closed',message:`${c.id} has been officially closed.`,time:'Just now',role:'student',target:c.id,targetStudentId:c.studentId});cvSave();toast('Concern closed.');setTimeout(()=>location.reload(),500)}</script></body></html>

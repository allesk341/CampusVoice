<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/staff.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>const u=cvCurrentUser();const content=`<div class="card form-card"><div class="profile-top"><div class="profile-photo-wrap">${avatarMarkup('profile-picture-preview')}<div><h2>${esc(cvName())}</h2><p>Staff · ${esc(u.id)} · ${esc(u.department||'—')}</p></div></div></div><div class="form-grid" style="margin-top:18px"><div class="field"><label>First Name</label><input value="${esc(u.firstName)}" disabled></div><div class="field"><label>Middle Initial</label><input value="${esc(u.middleInitial||'')}" disabled></div><div class="field"><label>Last Name</label><input value="${esc(u.lastName)}" disabled></div><div class="field"><label>Staff ID</label><input value="${esc(u.id)}" disabled></div><div class="field"><label>University Email</label><input value="${esc(u.email)}" disabled></div><div class="field"><label>Role</label><input value="Staff" disabled></div><div class="field"><label>Department / Work Area</label><input value="${esc(u.department||'—')}" disabled></div><div class="field"><label>Position</label><input value="${esc(u.position||'—')}" disabled></div><div class="field full"><label>Coverage</label><input value="${esc(u.coverage||'—')}" disabled></div><div class="field"><label>Contact Number</label><input id="contact" value="${esc(u.contact||'')}" placeholder="09XXXXXXXXX"></div><div class="field"><label>Profile Picture</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><div class="hint">Your photo will also appear in the top-right account area.</div></div><div class="field full"><label>New Password</label><input id="password" type="password" placeholder="Leave blank to keep current password"></div></div><div class="alert info" style="margin-top:18px">Managed by Administrator: name, Staff ID, university email, role, department, position, and coverage.</div><div class="form-actions"><button class="btn primary" id="saveProfile">Save Changes</button></div></div>`;shell('profile.html','My Profile','Your account and work assignment information.',content,'');document.getElementById('saveProfile').onclick=()=>{const p=document.getElementById('password').value.trim();cvSetProfile({contact:document.getElementById('contact').value.trim()});if(p)localStorage.setItem('cv_password_'+u.email,p);toast('Profile changes saved.')};document.getElementById('photo').onchange=e=>cvReadFile(e.target.files[0],data=>{if(data){cvSetProfile({profilePhoto:data});location.reload()}});</script></body></html>

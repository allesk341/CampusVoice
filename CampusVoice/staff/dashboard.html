<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | CampusVoice</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/staff.css"></head><body><script src="../js/demo-data.js"></script><script src="../js/shell.js"></script><script>const mine=CV.concerns.filter(c=>c.assigned===cvName());const attention=mine.filter(c=>['Assigned','In Progress','Waiting for Resources','Reopened'].includes(c.status));const rows=mine.map(c=>`<tr><td><a class="link" href="concern-details.html?id=${c.id}">${c.id}</a></td><td><strong>${esc(c.title)}</strong><br><span class="card-subtitle">${esc(c.category)} · ${esc(c.building)}</span></td><td>${priority(c.priority)}</td><td>${badge(c.status)}</td><td>${c.date}</td></tr>`).join('');const content=`<div class="hero staff-accent"><div class="eyebrow">GOOD MORNING, ${esc(cvName()).toUpperCase()}</div><h2>Stay on top of your assigned work.</h2><p>Review assigned concerns, record action taken, communicate clearly with students, and mark work resolved when the issue has been addressed.</p></div><div class="grid g4"><div class="card metric" onclick="location.href='concerns.html'"><div class="metric-label">ASSIGNED</div><div class="metric-value">${mine.filter(c=>c.status==='Assigned').length}</div><div class="metric-note">Newly assigned</div></div><div class="card metric" onclick="location.href='concerns.html?status=In Progress'"><div class="metric-label">IN PROGRESS</div><div class="metric-value">${mine.filter(c=>c.status==='In Progress').length}</div><div class="metric-note">Currently being addressed</div></div><div class="card metric" onclick="location.href='concerns.html?attention=1'"><div class="metric-label">NEEDS ATTENTION</div><div class="metric-value">${attention.length}</div><div class="metric-note">Requires action or follow-up</div></div><div class="card metric" onclick="location.href='concerns.html?status=Resolved'"><div class="metric-label">RESOLVED</div><div class="metric-value">${mine.filter(c=>c.status==='Resolved').length}</div><div class="metric-note">Completed concerns</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card attention-card"><div class="card-head"><div><h3 class="card-title">Today's Work</h3><div class="card-subtitle">Items requiring attention.</div></div></div><div class="list">${attention.slice(0,4).map(c=>`<div class="list-row"><div><b>${esc(c.id)} · ${esc(c.title)}</b><small>${esc(c.building)} · ${esc(c.area)} · ${esc(c.status)}</small></div>${priority(c.priority)}</div>`).join('')||'<div class="empty">You are all caught up.</div>'}</div></div><div class="card"><div class="card-head"><div><h3 class="card-title">My Work Queue</h3><div class="card-subtitle">All concerns currently assigned to you.</div></div><a class="link" href="concerns.html">Open queue →</a></div><div class="info-grid"><div class="info-box"><small>DEPARTMENT</small><b>${esc(cvCurrentUser().department||'—')}</b></div><div class="info-box"><small>ACTIVE WORKLOAD</small><b>${mine.filter(c=>!['Resolved','Closed'].includes(c.status)).length} active concerns</b></div></div><div class="alert warn" style="margin-top:12px">Concerns waiting for materials or funding are tracked separately so resource delays are not treated as staff inactivity.</div></div></div><div class="card" style="margin-top:18px"><div class="card-head"><div><h3 class="card-title">My Assigned Concerns</h3><div class="card-subtitle">Your current workload.</div></div><a class="link" href="concerns.html">View all →</a></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Concern</th><th>Priority</th><th>Status</th><th>Date</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;shell('dashboard.html','Dashboard','Your assigned work and daily queue.',content,'');</script></body></html>
